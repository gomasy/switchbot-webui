    <circle cx="38" cy="50" r="8" fill="#e74c3c"/>
    <circle cx="62" cy="50" r="8" fill="#e74c3c"/>
    <rect x="35" y="65" width="30" height="5" rx="2" fill="#e74c3c"/>
    <rect x="5" y="40" width="10" height="20" rx="4" fill="#fff"/>
    <rect x="85" y="40" width="10" height="20" rx="4" fill="#fff"/>
  </g>
</svg>
