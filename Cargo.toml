[package]
name = "switchbot-webui"
version = "1.0.2"
edition = "2024"

[dependencies]
axum = "0.8.9"
base64 = "0.22"
dotenvy = "0.15"
hmac = "0.13"
reqwest = "0.13"
sha2 = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros"] }
tower-http = { version = "0.7", features = ["fs"] }
uuid = { version = "1", features = ["v4"] }

[profile.release]
lto = true
strip = true
opt-level = "z"
codegen-units = 1
