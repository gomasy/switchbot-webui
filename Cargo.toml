[package]
name = "switchbot-webui"
edition = "2024"

[dependencies]
axum = "0.8.9"
base64 = "0.22.1"
dotenvy = "0.15.7"
hmac = "0.13"
reqwest = "0.13.4"
sha2 = "0.11"
tokio = { version = "1.53.0", features = ["rt-multi-thread", "net", "macros", "time"] }
tower-http = { version = "0.7", features = ["fs"] }
uuid = { version = "1.24.0", features = ["v4"] }

[profile.release]
lto = true
strip = true
opt-level = "z"
codegen-units = 1
