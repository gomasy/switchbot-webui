[package]
name = "switchbot-webui"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.23.0"
dotenvy = "0.15.7"
getrandom = "0.4.3"
hmac = "0.13"
reqwest = "0.13.4"
serde_json = "1.0.151"
sha2 = "0.11"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "macros", "time", "signal", "sync"] }
tower-http = { version = "0.7", features = ["fs"] }
uuid = { version = "1.24.0", features = ["v4"] }

[lints.clippy]
# No request may be able to take the process down. Nothing outside the tests
# unwraps today; denying it is what keeps that true as the code grows, and the
# `check` workflow runs clippy with -D warnings so it is enforced on every push.
# Tests are exempt via clippy.toml — there, a panic is how a failure is reported.
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
lto = true
strip = true
opt-level = "z"
codegen-units = 1
