[package]
name = "switchbot-webui"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
base64 = "0.22"
dotenvy = "0.15"
hmac = "0.12"
reqwest = "0.12"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros"] }
tower-http = { version = "0.6", features = ["fs"] }
uuid = { version = "1", features = ["v4"] }

[profile.release]
lto = true
strip = true
