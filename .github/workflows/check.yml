name: Check

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - '**'

permissions:
  contents: read

jobs:
  rustfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check formatting
        run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # --all-targets so the tests are linted too; they are exempt from the
      # unwrap/expect gate through clippy.toml rather than by going unchecked.
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Test
        run: cargo test --locked

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      # src/version.ts is generated rather than committed, and Header.tsx
      # imports it, so it has to exist before the typecheck runs.
      - name: Generate version module
        run: node scripts/gen-version.mjs
      - name: Typecheck
        run: npx tsc --noEmit
